<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profil maquilleuse — GlamBook</title>
  <meta name="description" content="Portfolio, avis clients et réservation en ligne de votre maquilleuse professionnelle sur GlamBook."/>
  <meta property="og:type" content="profile"/>
  <meta property="og:site_name" content="GlamBook"/>
  <meta property="og:title" content="Profil maquilleuse — GlamBook"/>
  <meta property="og:description" content="Portfolio, avis clients et réservation en ligne."/>
  <meta property="og:image" content="https://glambook-pi.vercel.app/icons/icon-512.png"/>
  <meta name="twitter:card" content="summary"/>
  <link rel="preconnect" href="https://lcrrdwlnxmneqfzqediu.supabase.co"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E0E10"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <script defer src="/js/theme.js"></script>
  <style>
    /* Fiche « Noir éditorial » — la photo d'abord, le nom en capitales serrées */
    :root { --artist-accent: var(--gb-champagne); }
    .nav { background: rgba(14,14,16,.82); }

    .p-hero { position: relative; height: clamp(380px, 56vh, 540px); overflow: hidden; background: var(--gb-surface); }
    .p-hero .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
    .p-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--gb-ground) 4%, rgba(14,14,16,.55) 42%, rgba(14,14,16,.1) 100%); }
    .p-hero-in { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; }
    .p-hero-in .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 26px; }
    .p-eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--artist-accent); }
    .profile-name { font-size: clamp(3.6rem, 9vw, 7rem); line-height: .86; margin: 8px 0 12px; }
    .profile-meta { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; font-size: .86rem; color: var(--gb-ink-2); }
    .profile-meta .stars { color: var(--gb-gold); }
    .profile-actions { flex-shrink: 0; }
    .profile-actions .btn { background: rgba(14,14,16,.6); }
    .profile-avatar { display: none; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
    .profile-body { max-width: 1200px; margin: 0 auto; padding: 24px 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 56px; }
    .p-sec { margin-bottom: 48px; }
    .p-sec .rule-head { margin-bottom: 18px; }
    .p-bio { font-family: var(--gb-font-serif); font-style: italic; font-size: 1.55rem; line-height: 1.35; color: #D9D4DB; margin: 0; max-width: 40ch; }
    .social-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--gb-r-sm); font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--gb-line-strong); color: var(--gb-ink-2); transition: border-color .15s, color .15s; }
    .social-link:hover { border-color: var(--gb-champagne); color: var(--gb-ink); }
    .guest-hint { font-size: .82rem; color: var(--gb-ink-2); display: block; line-height: 1.5; }
    .guest-hint .gb-ico { margin-right: 4px; }
    .p-hero.no-photo { height: 300px; }
    .guest-hint a { color: var(--gb-champagne); font-weight: 600; }

    /* Portfolio */
    .photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .photo-grid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: var(--gb-r-sm); cursor: zoom-in; background: var(--gb-surface-2); display: block; transition: filter .2s; }
    .photo-grid img:hover { filter: brightness(1.08); }
    .photo-grid > img:first-child:not(:only-child) { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; height: 100%; }

    /* Avis */
    .review-card { padding: 20px 0; border-bottom: 1px solid var(--gb-line); }
    .review-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .review-author { font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
    .review-date { font-size: .76rem; color: var(--gb-ink-3); }
    .review-text { font-family: var(--gb-font-serif); font-style: italic; font-size: 1.25rem; line-height: 1.4; color: #D9D4DB; margin: 6px 0 0; }
    .more-reviews { padding: 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--gb-ink-2); font-size: .88rem; }

    /* Colonne réservation */
    .booking-card, .guest-booking-card { background: var(--gb-surface); border: 1px solid var(--gb-line); border-radius: var(--radius); padding: 26px 24px; position: sticky; top: calc(var(--nav-h) + 20px); }
    .booking-card h3, .guest-booking-card .gb-title { font-size: 2.1rem; font-weight: 800; font-stretch: var(--gb-condensed); text-transform: uppercase; line-height: .95; margin: 0 0 6px; }
    .booking-price { font-size: .95rem; font-weight: 600; color: var(--gb-champagne); margin-bottom: 18px; }
    .service-option { display: block; border: none; border-bottom: 1px solid var(--gb-line); padding: 12px 2px; cursor: pointer; transition: background .15s; }
    .service-option:first-child { border-top: 1px solid var(--gb-line); }
    .service-option:hover { background: var(--gb-surface-2); }
    .service-option.selected { background: var(--gb-gold-tint); box-shadow: inset 2px 0 0 var(--artist-accent); padding-left: 10px; }
    .service-option .svc-name { font-weight: 800; font-size: 1.15rem; font-stretch: 75%; text-transform: uppercase; letter-spacing: .02em; }
    .service-option .svc-price { font-size: .9rem; color: var(--gb-champagne); font-weight: 600; white-space: nowrap; }
    .service-option .svc-dur { font-size: .78rem; color: var(--gb-ink-3); margin-top: 2px; }
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
    .slot-btn { padding: 9px 4px; border: 1px solid var(--gb-line-strong); border-radius: var(--gb-r-sm); font-size: .8rem; font-weight: 600; cursor: pointer; text-align: center; background: transparent; color: var(--gb-ink); transition: all .15s; }
    .slot-btn:hover, .slot-btn.selected { border-color: var(--artist-accent); background: var(--gb-gold-tint); color: var(--gb-champagne); }
    .slot-btn.taken { opacity: .4; pointer-events: none; text-decoration: line-through; }
    .card-note { font-size: .75rem; color: var(--gb-ink-3); text-align: center; margin-top: 12px; }



    /* Mobile : barre d'action fixe « Écrire | Demander un devis » */
    .m-cta { display: none; }
    @media (max-width: 860px) {
      .profile-body { grid-template-columns: 1fr; gap: 0; padding: 16px 16px 24px; }
      .wrap { padding: 0 16px; }
      .p-bio { font-size: 1.3rem; }
      .m-cta { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 210; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--gb-surface); border-top: 1px solid var(--gb-line); }
      .m-cta a { height: 52px; display: flex; align-items: center; justify-content: center; border-radius: var(--gb-r-md); text-decoration: none; }
      .m-cta .w { border: 1px solid var(--gb-line-strong); color: var(--gb-ink); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .m-cta .go { background: var(--gb-gold); color: var(--gb-cta-ink); font-size: 1.3rem; font-weight: 800; font-stretch: 75%; letter-spacing: .04em; text-transform: uppercase; }
      body.has-mcta { padding-bottom: 92px; }
      .booking-card, .guest-booking-card { position: static; }
    }

    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 500; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: var(--gb-r-sm); }
    .lightbox-close { position: absolute; top: 16px; right: 18px; width: 44px; height: 44px; color: var(--gb-paper); cursor: pointer; background: none; border: none; display: flex; align-items: center; justify-content: center; }
    .lightbox-close .gb-ico { width: 26px; height: 26px; }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Aller au contenu</a>

<nav class="nav">
  <div class="nav-inner" style="max-width:1200px;">
    <a href="/" class="nav-logo">Glam<span>Book</span></a>
    <div class="nav-links">
      <a href="/artists.html" class="hide-mobile">Toutes les maquilleuses</a>
      <span id="nav-auth">
        <a href="/auth/login.html">Connexion</a>
        <a href="/auth/register.html" class="btn-nav btn">Rejoindre</a>
      </span>
    </div>
  </div>
</nav>

<main id="main">
<header class="p-hero profile-header">
  <div class="cover" id="cover-img" aria-hidden="true"></div>
  <div class="p-hero-in">
    <div class="wrap">
      <div style="min-width:0;">
        <div class="profile-avatar" id="avatar"></div>
        <span class="p-eyebrow" id="artist-city"></span>
        <h1 class="profile-name" id="artist-name">Chargement…</h1>
        <div class="profile-meta">
          <span><span class="stars" id="stars-display"></span> <span id="rating-text"></span></span>
          <span id="badges-zone"></span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="btn btn-ghost btn-sm" id="btn-share">Partager</button>
      </div>
    </div>
  </div>
</header>

<div class="profile-body">
  <div>
    <section class="p-sec">
      <p class="p-bio" id="artist-bio"></p>
      <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;" id="social-links"></div>
    </section>

    <section class="p-sec" data-section="portfolio">
      <div class="rule-head"><span class="lbl">Portfolio</span><span class="aside">sur pièces</span></div>
      <div class="photo-grid" id="photo-grid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gb-ink-3);">Chargement du portfolio…</div>
      </div>
    </section>

    <section class="p-sec">
      <div class="rule-head"><span class="lbl">Spécialités</span></div>
      <div class="tags" id="specialties-tags"></div>
    </section>

    <section class="p-sec" data-section="avis">
      <div class="rule-head"><span class="lbl">Avis clientes <span id="review-count-title" style="color:var(--gb-ink-3);"></span></span></div>
      <div id="reviews-list">
        <div style="color:var(--gb-ink-3);padding:24px 0;">Aucun avis pour l'instant.</div>
      </div>
    </section>
  </div>

  <aside>
    <div class="booking-card" id="booking-card">
      <h3>Réserver</h3>
      <div class="booking-price" id="booking-price"></div>

      <div class="field">
        <label>Choisir une prestation</label>
        <div id="services-list"></div>
      </div>

      <div class="field">
        <label for="book-date">Date</label>
        <input type="date" id="book-date"/>
      </div>

      <div id="slots-section" style="display:none;">
        <label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:8px;">Créneaux disponibles</label>
        <div class="slots-grid" id="slots-grid"></div>
      </div>

      <button class="btn btn-primary btn-full" id="btn-book" disabled style="margin-top:16px;">
        Réserver ce créneau
      </button>
      <a class="btn btn-ghost btn-full" id="btn-contact" style="margin-top:8px;"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg> Écrire</a>
      <p class="card-note">Échangez avec la maquilleuse avant de vous engager.</p>
    </div>
  </aside>
</div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Fermer"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <img id="lightbox-img" src="" alt=""/>
</div>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<script type="module">
import { supabase, getCurrentUser, esc, safeUrl, specialtyLabel } from '/js/supabase.js';
import { ICON, localISODate } from '/js/utils.js';
import { initNav } from '/js/nav.js';
initNav();

// URL propre /artiste/<slug> (rewrite Vercel) ou fallback ?id=UUID
const slugMatch = location.pathname.match(/^\/artiste\/([^/]+)\/?$/);
const slug = slugMatch ? decodeURIComponent(slugMatch[1]) : null;
const idParam = new URLSearchParams(location.search).get('id');
if (!slug && !idParam) { location.href = '/artists.html'; }

let artistId = idParam;
let selectedService = null, selectedSlot = null, selectedDate = null;

// Vérifie si la cliente est connectée
let currentUser = null;
try { currentUser = await getCurrentUser(); } catch (_) {}
const isGuest = !currentUser;
const $id = (id) => document.getElementById(id);
const backHere = encodeURIComponent(location.pathname + location.search);

async function load() {
  // Vue publique : profil + photos joints en SQL, aucune donnée privée
  let q = supabase.from('artists_public').select('*');
  q = slug ? q.eq('slug', slug) : q.eq('id', artistId);
  const { data: a, error: loadErr } = await q.maybeSingle();

  if (!a) {
    // Profil inexistant ou désactivé, ou service indisponible : on le dit, plutôt qu'un squelette vide
    document.querySelector('.profile-header')?.remove();
    document.querySelector('.profile-body').outerHTML = `<div class="state-msg">
      <h2>${loadErr ? 'Profil momentanément indisponible' : 'Ce profil n’est plus en ligne'}</h2>
      <p>${loadErr ? 'Réessayez dans un instant.' : 'La maquilleuse a peut-être mis son profil en pause.'}</p>
      <a class="btn btn-primary" href="/artists.html">Voir les maquilleuses</a></div>`;
    document.title = 'Profil introuvable — GlamBook';
    return;
  }
  artistId = a.id;
  const contactBtn = document.getElementById('btn-contact');
  if (contactBtn) contactBtn.href = '/messages.html?artist=' + encodeURIComponent(artistId);

  // Appliquer les settings de personnalisation
  // Accent choisi par la maquilleuse. Les valeurs sont celles qui restent lisibles sur le fond
  // sombre du site ; la teinte de fond est dérivée de l'accent, jamais une couleur claire.
  const PALETTES = {
    rose:      { accent: null,      cover:'linear-gradient(135deg,#1F1C16,#0E0E10)' },
    or_noir:   { accent:'#D4AF37', cover:'linear-gradient(135deg,#0D0D0D,#2a2a2a)' },
    nude:      { accent:'#D9A982', cover:'linear-gradient(135deg,#5C3D2E,#C8956C)' },
    bordeaux:  { accent:'#D9728A', cover:'linear-gradient(135deg,#8B1A2A,#2D0A0E)' },
    bleu_nuit: { accent:'#8FB0E0', cover:'linear-gradient(135deg,#0D1B2A,#1B3A6B)' },
    emeraude:  { accent:'#6FC29A', cover:'linear-gradient(135deg,#0D2B1E,#1E5C3A)' },
    violet:    { accent:'#C08AD0', cover:'linear-gradient(135deg,#1A0A20,#4A1A5C)' },
    corail:    { accent:'#F08A75', cover:'linear-gradient(135deg,#C0392B,#E8614A)' },
  };
  const s = a.profile_settings || {};
  const palette = PALETTES[s.palette] || PALETTES.rose;
  const sections = s.sections || {};
  const ctaText  = s.cta_text || 'Réserver ce créneau';

  if (palette.accent) {
    const styleEl = document.createElement('style');
    styleEl.textContent = `:root { --artist-accent: ${palette.accent}; }`;
    document.head.appendChild(styleEl);
  }

  // Bouton CTA
  $id('btn-book').textContent = ctaText;

  // Sections que la maquilleuse a choisi de masquer. On masque sans supprimer :
  // la suite du script écrit dans ces blocs, et un élément retiré faisait planter toute la page.
  const hide = (el) => { if (el) el.hidden = true; };
  if (sections.portfolio === false) hide(document.querySelector('[data-section="portfolio"]'));
  if (sections.avis      === false) hide(document.querySelector('[data-section="avis"]'));
  if (sections.social    === false) hide($id('social-links'));
  // « Prestations & tarifs » masqués : la carte reste (c'est le seul moyen de la contacter),
  // seuls la liste des prestations et le prix d'appel disparaissent.
  const hideServices = sections.services === false;

  const p = { full_name: a.display_name, avatar_url: a.avatar_url, city: a.city, region: a.region };
  const displayName = a.display_name || 'Maquilleuse';
  document.title = `${displayName} — Maquilleuse${a.city ? ' à ' + a.city : ''} | GlamBook`;

  // Canonical + OG dynamiques
  const pageUrl = a.slug ? `https://glambook-pi.vercel.app/artiste/${encodeURIComponent(a.slug)}` : location.href;
  const canonical = document.createElement('link');
  canonical.rel = 'canonical'; canonical.href = pageUrl;
  document.head.appendChild(canonical);
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', document.title);
  const firstPhoto = (a.photos || [])[0]?.url;
  if (firstPhoto) document.querySelector('meta[property="og:image"]')?.setAttribute('content', firstPhoto);

  // Données structurées LocalBusiness
  const ld = {
    '@context': 'https://schema.org',
    '@type': 'BeautySalon',
    name: displayName,
    url: pageUrl,
    description: a.bio || 'Maquilleuse professionnelle',
    image: firstPhoto || undefined,
    address: a.city ? { '@type': 'PostalAddress', addressLocality: a.city, addressCountry: 'FR' } : undefined,
    priceRange: a.price_from ? `À partir de ${a.price_from}€` : undefined
  };
  if (a.review_count > 0) {
    ld.aggregateRating = { '@type': 'AggregateRating', ratingValue: Number(a.rating_avg), reviewCount: a.review_count, bestRating: 5 };
  }
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(ld);
  document.head.appendChild(ldScript);

  // Couverture : la photo choisie, sinon la première du portfolio, sinon le dégradé de la palette
  const coverEl = $id('cover-img');
  const coverUrl = safeUrl(s.cover_url) || safeUrl(firstPhoto);
  coverEl.style.background = palette.cover;
  if (!coverUrl) document.querySelector('.p-hero')?.classList.add('no-photo');
  if (coverUrl) {
    const img = new Image();
    img.className = 'cover'; img.alt = '';
    img.onload = () => coverEl.replaceWith(img);
    img.src = coverUrl;
  }

  // Avatar (le nom vient de la maquilleuse : toujours échappé)
  const avatarEl = $id('avatar');
  const avatarUrl = safeUrl(p.avatar_url);
  if (avatarUrl) {
    avatarEl.innerHTML = `<img src="${esc(avatarUrl)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" alt=""/>`;
  } else {
    avatarEl.textContent = (p.full_name || '?')[0];
  }

  document.getElementById('artist-name').textContent = p.full_name || 'Maquilleuse';
  const eyebrowSpecs = (a.specialties || []).slice(0, 2).map(x => specialtyLabel(x).toLowerCase());
  document.getElementById('artist-city').textContent = [p.city || p.region || 'France', ...eyebrowSpecs].join(' · ');
  document.getElementById('artist-bio').textContent = a.bio || 'Cette maquilleuse n’a pas encore rédigé sa présentation.';
  $id('booking-price').textContent = (a.price_from && !hideServices) ? `dès ${Math.round(a.price_from)} €` : 'Sur devis';

  // Note : pas d'etoiles tant qu'aucune cliente n'a note ce profil.
  // (reviewCount et non « reviews » : ce nom est repris plus bas pour la liste des avis —
  //  les deux déclarations dans la même fonction empêchaient tout le script de démarrer.)
  const reviewCount = parseInt(a.review_count) || 0;
  const sd = document.getElementById('stars-display');
  const rt = document.getElementById('rating-text');
  if (reviewCount > 0) {
    const avg = Number(a.rating_avg) || 5;
    const full = Math.round(avg);
    sd.textContent = '★'.repeat(full) + '☆'.repeat(5 - full);
    rt.textContent = `${avg.toFixed(1).replace('.', ',')} (${reviewCount} avis)`;
  } else {
    sd.textContent = '';
    rt.innerHTML   = '<span class="new-badge">Nouvelle sur GlamBook</span>';
  }

  // Badges
  const bz = document.getElementById('badges-zone');
  if (a.is_verified) bz.innerHTML += `<span class="badge badge-vert" title="Identité et activité contrôlées par GlamBook">${ICON.check} Vérifiée</span> `;
  if (a.review_count >= 10) bz.innerHTML += '<span class="badge badge-or"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8Z"/></svg> Top artiste</span>';

  // Spécialités
  document.getElementById('specialties-tags').innerHTML = (a.specialties || [])
    .map(s => `<span class="tag">${esc(specialtyLabel(s))}</span>`).join('');

  // Réseaux sociaux — publics : ce sont des liens que la maquilleuse publie elle-même
  {
    const socials = [];
    const igUrl = safeUrl(a.instagram), ttUrl = safeUrl(a.tiktok), ytUrl = safeUrl(a.youtube), wsUrl = safeUrl(a.website);
    if (igUrl) socials.push(`<a class="social-link" href="${esc(igUrl)}" target="_blank" rel="noopener noreferrer"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="3"/><circle cx="12" cy="14" r="3.4"/><path d="M9 7l1.4-2.4h3.2L15 7"/></svg> Instagram</a>`);
    if (ttUrl) socials.push(`<a class="social-link" href="${esc(ttUrl)}" target="_blank" rel="noopener noreferrer"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg> TikTok</a>`);
    if (ytUrl) socials.push(`<a class="social-link" href="${esc(ytUrl)}" target="_blank" rel="noopener noreferrer">${ICON.play} YouTube</a>`);
    if (wsUrl) socials.push(`<a class="social-link" href="${esc(wsUrl)}" target="_blank" rel="noopener noreferrer"><svg class="gb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"/></svg> Site web</a>`);
    document.getElementById('social-links').innerHTML = socials.join('');
  }


// ── Réservation : deux modes selon l'artiste ──────────────────────────
// Si la maquilleuse a saisi des prestations tarifées, on garde la réservation
// directe par créneau. Sinon la carte bascule en demande de devis.
function quoteUrl() {
  return '/reservation.html?artist=' + encodeURIComponent(artistId);
}

function switchToQuoteMode() {
  const card = document.getElementById('booking-card');
  if (!card) return;
  const h3 = card.querySelector('h3');
  if (h3) h3.textContent = 'Demander un devis';
  const lbl = document.getElementById('services-list')?.closest('.field')?.querySelector('label');
  if (lbl) lbl.hidden = true;
  // On masque sans supprimer : d'autres handlers du module référencent
  // #book-date, #slots-section et #btn-book sans garde.
  const dateField = document.getElementById('book-date')?.closest('.field');
  if (dateField) dateField.style.display = 'none';
  const slots = document.getElementById('slots-section');
  if (slots) slots.style.display = 'none';
  const btn = document.getElementById('btn-book');
  if (!btn) return;
  btn.style.display = 'none';
  const link = document.createElement('a');
  link.className = 'btn btn-primary btn-full';
  link.style.marginTop = '16px';
  link.textContent = 'Demander un devis';
  link.href = quoteUrl();
  btn.parentNode.insertBefore(link, btn);
}

function addQuoteLink() {
  const btn = document.getElementById('btn-book');
  if (!btn || document.getElementById('btn-quote')) return;
  const link = document.createElement('a');
  link.id = 'btn-quote';
  link.className = 'btn btn-ghost btn-full';
  link.style.marginTop = '8px';
  link.textContent = 'Demander un devis';
  link.href = quoteUrl();
  btn.parentNode.insertBefore(link, btn.nextSibling);
}

  // Services — visibles pour tous (pour donner envie), mais réservation bloquée
  const { data: svcRows } = await supabase.from('services').select('*').eq('artist_id', artistId).order('price_cents');
  const services = hideServices ? [] : (svcRows || []);
  const sl = document.getElementById('services-list');
  if (services.length > 0) {
    sl.innerHTML = services.map(s => `
      <div class="service-option" data-id="${esc(s.id)}" data-price="${esc(s.price_cents)}" data-name="${esc(s.name)}" onclick="${isGuest ? 'showGuestPrompt()' : 'selectService(this)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="svc-name">${esc(s.name)}</span>
          <span class="svc-price">${(s.price_cents/100).toFixed(0)} €</span>
        </div>
        <div class="svc-dur">${esc(String(s.duration_min))} min${s.description ? ' · ' + esc(s.description) : ''}</div>
      </div>`).join('');
    addQuoteLink();
  } else {
    sl.innerHTML = '<p style="color:var(--gb-ink-2);font-size:.88rem;">Elle travaille sur devis : décrivez votre événement, elle vous répond avec une proposition chiffrée.</p>';
    switchToQuoteMode();
  }

  // Portfolio — photos déjà jointes par la vue ; 2 visibles + flou pour les guests
  const photos = (a.photos || []).map(ph => ({ ...ph, url: safeUrl(ph.url) })).filter(ph => ph.url).slice(0, 12);
  const pg = document.getElementById('photo-grid');
  if (photos.length > 0) {
    {
      pg.innerHTML = photos.map(ph => `<img src="${esc(ph.url)}" alt="${esc(ph.caption||'')}" loading="lazy" data-zoom>`).join('');
      pg.querySelectorAll('img[data-zoom]').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    }
  } else {
    pg.innerHTML = '<p style="grid-column:1/-1;color:var(--gris);text-align:center;padding:24px;">Portfolio en cours de construction</p>';
  }

  // Avis — vue reviews_public (nom du reviewer sans exposer profiles)
  const { data: reviews } = await supabase
    .from('reviews_public').select('*')
    .eq('artist_id', artistId).order('created_at', { ascending: false })
    .limit(10);

  const rl = document.getElementById('reviews-list');
  if (reviews && reviews.length > 0) {
    const stars = (n) => { const k = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '★'.repeat(k) + '☆'.repeat(5 - k); };
    document.getElementById('review-count-title').textContent = `(${a.review_count || reviews.length})`;
    rl.innerHTML = reviews.map(r => `
      <div class="review-card">
        <div class="review-header">
          <span class="review-author">${esc(r.reviewer_name || 'Cliente')}</span>
          <span class="review-date">${new Date(r.created_at).toLocaleDateString('fr-FR')}</span>
        </div>
        <div style="margin-bottom:6px;" class="stars">${stars(r.rating)}</div>
        <p class="review-text">${esc(r.comment || '')}</p>
      </div>`).join('');
  } else {
    rl.innerHTML = '<p style="color:var(--gb-ink-3);padding:12px 0;">Pas encore d’avis sur ce profil.</p>';
  }

  // Colonne réservation — remplacée pour les guests
  if (isGuest) {
    const quoteMode = services.length === 0;
    // Après inscription ou connexion, la cliente arrive directement là où elle voulait aller
    const next = encodeURIComponent(quoteMode ? quoteUrl() : location.pathname + location.search);
    const first = esc((p.full_name || '').split(' ')[0]);
    document.getElementById('booking-card').outerHTML = `
      <div class="guest-booking-card">
        <p class="gb-title">${quoteMode ? 'Demandez un devis' : 'Prenez rendez-vous'}${first ? ' à ' + first : ''}</p>
        <p style="font-size:.88rem;color:var(--gb-ink-2);margin:10px 0 20px;">${quoteMode
          ? 'Décrivez votre besoin : elle vous répond avec une proposition chiffrée, sans engagement.'
          : 'Créez un compte gratuit pour voir ses créneaux et réserver en ligne.'}</p>
        <a href="/auth/register.html?redirect=${next}" class="btn btn-primary btn-full" style="display:block;text-align:center;margin-bottom:10px;">
          ${quoteMode ? 'Demander un devis' : 'Créer un compte gratuit'}
        </a>
        <a href="/auth/login.html?redirect=${next}" class="btn btn-ghost btn-full" style="display:block;text-align:center;">
          J'ai déjà un compte
        </a>
        <p class="card-note">Compte gratuit · aucune carte bancaire demandée</p>
      </div>`;
  }

  // Mobile : barre d'action fixe (Écrire | action principale)
  const quoteModeAll = services.length === 0;
  const nextAfterAuth = encodeURIComponent(quoteModeAll ? quoteUrl() : location.pathname + location.search);
  const msgHref = '/messages.html?artist=' + encodeURIComponent(artistId);
  const mcta = document.createElement('div');
  mcta.className = 'm-cta';
  mcta.innerHTML = `
    <a class="w" href="${isGuest ? '/auth/register.html?redirect=' + encodeURIComponent(msgHref) : msgHref}">Écrire</a>
    <a class="go" href="${isGuest ? '/auth/register.html?redirect=' + nextAfterAuth : (quoteModeAll ? quoteUrl() : '#booking-card')}">${quoteModeAll ? 'Demander un devis' : 'Réserver'}</a>`;
  document.body.appendChild(mcta);
  document.body.classList.add('has-mcta');
}

window.showGuestPrompt = function() {
  location.href = `/auth/register.html?redirect=${backHere}`;
};

// Sélection service
window.selectService = function(el) {
  document.querySelectorAll('.service-option').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  selectedService = { id: el.dataset.id, price: el.dataset.price, name: el.dataset.name };
  checkCanBook();
};

// Sélection date → charger créneaux
document.getElementById('book-date').addEventListener('change', async function() {
  selectedDate = this.value;
  selectedSlot = null;
  const sec  = document.getElementById('slots-section');
  const grid = document.getElementById('slots-grid');
  grid.innerHTML = '<span style="color:var(--gris);font-size:.82rem;">Chargement...</span>';
  sec.style.display = 'block';

  const { data: avail } = await supabase
    .from('availabilities')
    .select('*')
    .eq('artist_id', artistId)
    .eq('date', selectedDate)
    .order('time_slot');

  if (!avail || avail.length === 0) {
    grid.innerHTML = '<span style="color:var(--gris);font-size:.82rem;grid-column:1/-1;">Aucun créneau ce jour-là</span>';
  } else {
    grid.innerHTML = avail.map(slot =>
      `<button type="button" class="slot-btn ${(slot.is_booked || slot.is_available === false) ? 'taken' : ''}" data-id="${esc(slot.id)}" data-time="${esc(slot.time_slot)}" onclick="selectSlot(this)">
         ${esc(slot.time_slot)}
       </button>`
    ).join('');
  }
  checkCanBook();
});

window.selectSlot = function(el) {
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedSlot = { id: el.dataset.id, time: el.dataset.time };
  checkCanBook();
};

function checkCanBook() {
  document.getElementById('btn-book').disabled = !(selectedService && selectedDate && selectedSlot);
}

document.getElementById('btn-book').addEventListener('click', async () => {
  const user = await getCurrentUser();
  if (!user) { location.href = `/auth/login.html?redirect=${backHere}`; return; }
  if (!selectedService || !selectedSlot) return;
  const params = new URLSearchParams({
    artist: artistId,
    service: selectedService.id,
    slot: selectedSlot.id,
    date: selectedDate,
    time: selectedSlot.time
  });
  location.href = '/booking.html?' + params.toString();
});

document.getElementById('btn-share').addEventListener('click', () => {
  // Partage annulé par l'utilisatrice = promesse rejetée : on l'ignore
  if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(() => {});
  else navigator.clipboard.writeText(location.href).then(() => showToast('Lien copié !'), () => showToast('Copie impossible'));
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Lightbox
window.openLightbox = function(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
};

document.getElementById('book-date').min = localISODate();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
load().catch((e) => { console.error('profil', e); });
</script>
</body>
</html>
