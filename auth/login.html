<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion — GlamBook</title>
  <meta name="robots" content="noindex"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E0E10"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="auth">
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Glam<span>Book</span></a>
  </div>
</nav>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Bon retour</h1>
    <p class="auth-sub">Connectez-vous pour retrouver vos devis et vos messages</p>

    <div class="form-msg err" id="error-msg" role="alert"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="vous@exemple.fr" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="pw-wrap">
          <input type="password" id="password" required autocomplete="current-password"/>
          <button type="button" class="pw-toggle" id="toggle-password" aria-label="Afficher le mot de passe" aria-pressed="false"></button>
        </div>
      </div>
      <div style="text-align:right; margin-top:-10px; margin-bottom:18px;">
        <a href="/auth/forgot.html" class="auth-link" style="font-size:.82rem;font-weight:500;">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-login">Se connecter</button>
    </form>

    <div class="divider">ou</div>

    <button class="btn btn-ghost btn-full" id="btn-google" style="gap:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuer avec Google
    </button>

    <div class="auth-footer">
      Pas encore de compte ?
      <a href="/auth/register.html" id="link-register">Créer un compte</a>
    </div>
    <div class="auth-footer" style="margin-top:8px;">
      Vous êtes maquilleuse ?
      <a href="/auth/register.html?role=artist">Créer un profil professionnel</a>
    </div>
  </div>
</main>

<script type="module">
import { supabase } from '/js/supabase.js';
import { safeRedirect, ICON } from '/js/utils.js';

// Retour après connexion : chemins internes uniquement (pas d'open redirect)
const redirect = safeRedirect(new URLSearchParams(location.search).get('redirect'));
if (redirect) document.getElementById('link-register').href = '/auth/register.html?redirect=' + encodeURIComponent(redirect);

// Déjà connecté → rediriger vers le bon espace
try {
  const { data: { user: existingUser } } = await supabase.auth.getUser();
  if (existingUser) redirectAfterLogin(existingUser);
} catch (_) {}

// Afficher / masquer le mot de passe
const toggle = document.getElementById('toggle-password');
toggle.innerHTML = ICON.eye;
toggle.addEventListener('click', () => {
  const input = document.getElementById('password');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  toggle.innerHTML = show ? ICON.eyeOff : ICON.eye;
  toggle.setAttribute('aria-pressed', String(show));
  toggle.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Connexion…';
  hideError();

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  let data, error;
  try { ({ data, error } = await supabase.auth.signInWithPassword({ email, password })); }
  catch (err) { error = { message: 'network' }; }
  if (error) {
    const m = error.message || '';
    const msg = /Invalid login credentials/i.test(m) ? 'Email ou mot de passe incorrect.'
      : /Email not confirmed/i.test(m) ? 'Confirmez d’abord votre adresse : le lien se trouve dans l’email reçu à l’inscription.'
      : /rate limit|Too many/i.test(m) ? 'Trop de tentatives. Réessayez dans quelques minutes.'
      : /captcha/i.test(m) ? 'La vérification anti-robot a échoué. Rechargez la page et réessayez.'
      : 'Connexion impossible pour le moment. Réessayez dans un instant.';
    showError(msg);
    btn.disabled = false; btn.textContent = 'Se connecter';
    return;
  }
  redirectAfterLogin(data.user);
});

document.getElementById('btn-google').addEventListener('click', async () => {
  const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + (redirect || '/') } });
  if (error) showError('La connexion avec Google n’est pas disponible pour le moment.');
});

async function redirectAfterLogin(user) {
  if (redirect) { location.href = redirect; return; }
  let role = null;
  try { role = (await supabase.from('profiles').select('role').eq('user_id', user.id).maybeSingle()).data?.role; } catch (_) {}
  location.href = role === 'artist' ? '/dashboard/artist.html' : role === 'admin' ? '/dashboard/admin.html' : '/mes-devis.html';
}

function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.add('show'); }
function hideError() { document.getElementById('error-msg').classList.remove('show'); }
</script>
</body>
</html>
