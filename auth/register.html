<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Créer un compte — GlamBook</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E0E10"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
    .role-btn {
      padding: 16px 12px; border-radius: 14px; border: 1.5px solid var(--gb-line-strong); color: var(--gb-ink);
      cursor: pointer; text-align: center; transition: all var(--transition); background: transparent; font-family: inherit;
    }
    .role-btn:hover { border-color: var(--gb-champagne); }
    .role-btn .role-icon { font-size: 1.5rem; line-height: 0; margin-bottom: 8px; color: var(--gb-ink-2); display: block; }
    .role-btn .role-name { font-size: .88rem; font-weight: 700; display: block; }
    .role-btn .role-desc { font-size: .72rem; color: var(--gb-ink-2); margin-top: 2px; display: block; }
    .role-btn[aria-pressed="true"] { border-color: var(--gb-gold); background: var(--gb-gold-tint); }
    .role-btn[aria-pressed="true"] .role-name, .role-btn[aria-pressed="true"] .role-icon { color: var(--gb-champagne); }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .name-row { grid-template-columns: 1fr; gap: 0; } }
    .artist-fields { display: none; }
    .artist-fields.show { display: block; }
    .artist-note { background: var(--gb-gold-tint); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: .82rem; color: var(--gb-champagne); }
    .consent { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: .82rem; color: var(--gb-ink-2); margin-bottom: 18px; }
    .consent input { margin-top: 3px; accent-color: var(--gb-gold); }
  </style>
</head>
<body class="auth">
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Glam<span>Book</span></a>
  </div>
</nav>

<main class="auth-wrap">
  <div class="auth-card wide">
    <h1 class="auth-title">Créer mon compte</h1>
    <p class="auth-sub" id="auth-sub">Gratuit, sans carte bancaire</p>

    <!-- Rôle -->
    <div class="role-toggle" role="group" aria-label="Type de compte">
      <button type="button" class="role-btn" id="role-client" data-role="client" aria-pressed="true">
        <span class="role-icon" data-ico="user"></span>
        <span class="role-name">Je suis cliente</span>
        <span class="role-desc">Je cherche une maquilleuse</span>
      </button>
      <button type="button" class="role-btn" id="role-artist" data-role="artist" aria-pressed="false">
        <span class="role-icon" data-ico="brush"></span>
        <span class="role-name">Je suis maquilleuse</span>
        <span class="role-desc">Je propose mes prestations</span>
      </button>
    </div>

    <div class="form-msg err" id="error-msg" role="alert"></div>
    <div class="form-msg ok" id="success-msg" role="status"></div>

    <form id="register-form">
      <div class="name-row">
        <div class="field">
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname" required autocomplete="given-name"/>
        </div>
        <div class="field">
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" required autocomplete="family-name"/>
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@exemple.fr" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="city">Ville</label>
        <input type="text" id="city" placeholder="Annecy, Lyon, Genève…" autocomplete="address-level2"/>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="pw-wrap">
          <input type="password" id="password" required minlength="8" autocomplete="new-password"/>
          <button type="button" class="pw-toggle" id="toggle-password" aria-label="Afficher le mot de passe" aria-pressed="false"></button>
        </div>
        <div class="hint">8 caractères minimum</div>
      </div>

      <!-- Maquilleuse : rien de plus ici, la fiche se crée juste après, écran par écran -->
      <div class="artist-fields" id="artist-fields">
        <div class="artist-note">Ensuite, cinq minutes pour créer votre fiche : vos photos, vos tarifs, vos créneaux. Gratuit, sans engagement.</div>
      </div>
      <label class="consent">
        <input type="checkbox" id="cgu" required/>
        <span>J'accepte les <a href="/legal/cgu.html" target="_blank" class="auth-link">CGU</a> et la <a href="/legal/confidentialite.html" target="_blank" class="auth-link">politique de confidentialité</a></span>
      </label>

      <button type="submit" class="btn btn-primary btn-full" id="btn-register">Créer mon compte</button>
    </form>

    <div class="auth-footer">
      Déjà un compte ? <a href="/auth/login.html" id="link-login">Se connecter</a>
    </div>
  </div>
</main>

<script type="module">
import { supabase } from '/js/supabase.js';
import { safeRedirect, ICON } from '/js/utils.js';

const params = new URLSearchParams(location.search);
// Page d'où vient la visiteuse (fiche artiste, demande de devis…) : on l'y renvoie une fois inscrite
const redirect = safeRedirect(params.get('redirect'));
const loginHref = '/auth/login.html' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
document.getElementById('link-login').href = loginHref;
if (redirect) document.getElementById('auth-sub').textContent = 'Un compte gratuit suffit pour continuer';

document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = ICON[el.dataset.ico] || ''; });

let currentRole = params.get('role') || 'client';
// Sécurité : n'autoriser que les rôles connus
if (!['client','artist'].includes(currentRole)) currentRole = 'client';

function setRole(role) {
  currentRole = role;
  document.getElementById('role-client').setAttribute('aria-pressed', String(role === 'client'));
  document.getElementById('role-artist').setAttribute('aria-pressed', String(role === 'artist'));
  document.getElementById('artist-fields').classList.toggle('show', role === 'artist');
  document.querySelector('.auth-title').textContent = role === 'artist' ? 'Créer mon profil pro' : 'Créer mon compte';
}
document.querySelectorAll('.role-btn').forEach(btn => btn.addEventListener('click', () => setRole(btn.dataset.role)));
setRole(currentRole);

const toggle = document.getElementById('toggle-password');
toggle.innerHTML = ICON.eye;
toggle.addEventListener('click', () => {
  const input = document.getElementById('password');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  toggle.innerHTML = show ? ICON.eyeOff : ICON.eye;
  toggle.setAttribute('aria-pressed', String(show));
  toggle.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-register');
  const reset = () => { btn.disabled = false; btn.textContent = 'Créer mon compte'; };
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Création…';
  hideMessages();

  const email      = document.getElementById('email').value.trim();
  const password   = document.getElementById('password').value;
  const firstName  = document.getElementById('firstname').value.trim();
  const lastName   = document.getElementById('lastname').value.trim();
  const city       = document.getElementById('city').value.trim();
  const isArtist   = currentRole === 'artist';
  const fullName   = `${firstName} ${lastName}`.trim();

  try {
    // Le profil (table profiles) est créé côté base à partir de ces métadonnées.
    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: {
        data: { full_name: fullName, display_name: fullName, role: currentRole, city },
        // Après le clic sur le lien de confirmation : là où elle allait
        emailRedirectTo: location.origin + (redirect || (isArtist ? '/dashboard/bienvenue.html' : '/mes-devis.html')),
      }
    });

    if (error) {
      const m = (typeof error.message === 'string') ? error.message : '';
      if (/already registered/i.test(m)) return alreadyRegistered(reset);
      const msg = /at least \d+ characters|weak/i.test(m) ? 'Le mot de passe doit contenir au moins 8 caractères.'
        : /invalid format|invalid email/i.test(m) ? 'Adresse email invalide.'
        : /rate limit|security purposes/i.test(m) ? 'Trop de tentatives. Patientez quelques minutes avant de réessayer.'
        : /signup.*disabled/i.test(m) ? 'Les inscriptions sont momentanément fermées.'
        : /captcha/i.test(m) ? 'La vérification anti-robot a échoué. Rechargez la page et réessayez.'
        : 'Inscription impossible pour le moment. Réessayez dans un instant.';
      showError(msg); reset(); return;
    }

    // Email déjà utilisé : selon le réglage du projet, Supabase répond sans erreur
    // mais avec un utilisateur sans identité.
    if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return alreadyRegistered(reset);

    // Confirmation par email exigée : pas de session tant que le lien n'est pas cliqué.
    // On le dit clairement au lieu d'envoyer vers un espace qui renverrait à la connexion.
    if (!data?.session) {
      document.getElementById('register-form').hidden = true;
      document.querySelector('.role-toggle').hidden = true;
      showSuccess(`Presque terminé : un email vient d’être envoyé à ${email}. Cliquez sur le lien qu’il contient pour activer votre compte, puis connectez-vous.`);
      return;
    }

    if (isArtist) {
      // Fiche artiste inactive ; note et vérification sont fixées côté base, pas ici.
      const { error: artistErr } = await supabase.from('artists').insert({ user_id: data.user.id, display_name: fullName, is_active: false });
      if (artistErr) console.warn('Fiche artiste :', artistErr.message); // le tableau de bord la recrée au besoin
    }

    showSuccess('Compte créé. Redirection…');
    const next = redirect || (isArtist ? '/dashboard/bienvenue.html' : '/artists.html');
    setTimeout(() => { location.href = next; }, 900);

  } catch (err) {
    console.error(err);
    showError('Une erreur inattendue est survenue. Veuillez réessayer.');
    reset();
  }
});

function alreadyRegistered(reset) {
  const el = document.getElementById('error-msg');
  el.textContent = 'Cette adresse email a déjà un compte. ';
  const a = document.createElement('a'); a.href = loginHref; a.textContent = 'Se connecter';
  el.appendChild(a); el.classList.add('show');
  reset();
}
function showError(msg)   { const el = document.getElementById('error-msg');   el.textContent = msg; el.classList.add('show'); }
function showSuccess(msg) { const el = document.getElementById('success-msg'); el.textContent = msg; el.classList.add('show'); }
function hideMessages()   { document.getElementById('error-msg').classList.remove('show'); document.getElementById('success-msg').classList.remove('show'); }
</script>
</body>
</html>
